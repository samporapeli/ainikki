# Provider definitions and default per-step model chains.
# Provider names are arbitrary; ``type`` controls response parsing.
# ``base_url`` and ``api_key`` support ``$VAR`` and ``${VAR:-default}``.

providers:
  openrouter:
    type: openrouter
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 60
  local:
    type: openai_compatible
    base_url_env: "OLLAMA_HOST"
    timeout: 500

# Topics may replace a step's chain in their own ``steps`` block.
steps:
  filter_topic:
    models:
      - provider: local
        model: "qwen3.6:35b-a3b"
        temperature: 0.6
      - provider: openrouter
        model: "openai/gpt-4o-mini"
  cluster:
    models:
      - provider: openrouter
        model: "openai/gpt-4o-mini"
  score:
    models:
      - provider: openrouter
        model: "openai/gpt-5.6-luna"
  compose:
    models:
      - provider: openrouter
        model: "google/gemini-3.8-flash"
        temperature: 0
  overview:
    models:
      - provider: openrouter
        model: "anthropic/claude-sonnet-5"
        temperature: 0
