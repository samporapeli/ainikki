# models.yaml
# Step name -> which model runs it. CLI flag --model-override
# (e.g. --model-override score=openrouter:gpt-4o-mini) overrides this on a
# per-run basis, e.g. for A/B comparisons.

default_provider: openrouter

steps:
  cluster:
    provider: openrouter
    model: "openai/gpt-4o-mini"     # cheap, the task is mostly classification
  filter_topic:
    provider: openrouter
    model: "openai/gpt-4o-mini"     # cheap, binary relevance check
  score:
    provider: openrouter
    model: "deepseek/deepseek-v4-flash"     # cheap, structured output is sufficient
  compose:
    provider: openrouter
    model: "anthropic/claude-sonnet-5"    # higher quality, fluent Finnish text
    max_tokens: 2048
  overview:
    provider: openrouter
    model: "google/gemini-2.5-flash"
    max_tokens: 2048
