# Sources to use for the AI topic (keys from config/sources.yaml).
public: true
target_audience: >
  Kokenut ohjelmistokehittäjä joka seuraa AI-alaa aktiivisesti mutta
  ei ehdi lukea kaikkea itse. Ei tarvitse peruskäsitteiden selityksiä
  (esim. mitä on LLM, mitä on RAG).
period: daily

topic_description: |
  Tekoäly

  PIDÄ:
  - tekoälymallit, LLM:t, agentit, tutkimus, turvallisuus ja arviointi
  - AI-työkalut, tuotteet, hinnoittelu ja käyttöönotto, myös ohjelmistokehityksessä
  - tekoälyn vaikutukset työhön, luovaan työhön, koulutukseen, palveluihin ja arkeen
  - tekoälyyn liittyvä luottamus, sääntely, oikeudet, markkinat, valta ja infrastruktuuri

  JÄTÄ POIS:
  - yleinen robotiikka, automaatio tai algoritmit ilman selvää AI-yhteyttä
  - teknologiajuttu, jossa AI on vain taustalla tai sivumaininta
  - juttu, jossa AI:ta käytetään tutkimuksen työkaluna mutta se ei ole jutun aihe
tts:
  enabled: true
  provider: google-cloud
  voice: fi-FI-Chirp3-HD-Achird
sources:
  - hn
  - yle-tiede
  - yle-internet
  - yle-mot
  - yle-talous
  - yle-kotimaa
  - yle-ulkomaat
  - yle-politiikka
  - yle-kolumnit
  - openai
  - blog-google
  - evanhahn
  - simonwillison
  - arstechnica-ai
