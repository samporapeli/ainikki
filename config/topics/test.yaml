# Topic: test (development-only, not published)
#
# Per-topic chain overrides the default model chain. First entry is tried;
# subsequent entries are fallbacks in priority order.

public: false
target_audience: >
  Testiajoa varten koottu uutisyleisö, joka tuntee teknologian ja
  tekoälyn peruskäsitteet.
period: daily

steps:
  cluster:
    models:
      - provider: local
        model: "ornith-1.5:35b"
      - provider: openrouter
        model: "openai/gpt-4o-mini"
  filter_topic:
    models:
      - provider: local
        model: "ornith-1.5:35b"
      - provider: openrouter
        model: "openai/gpt-4o-mini"
  score:
    models:
      - provider: local
        model: "ornith-1.5:35b"
      - provider: openrouter
        model: "openai/gpt-4o-mini"
  compose:
    models:
      - provider: local
        model: "ornith-1.5:35b"
      - provider: openrouter
        model: "openai/gpt-4o-mini"
  overview:
    models:
      - provider: openrouter
        model: "openai/gpt-4o-mini"

tts:
  enabled: true
  provider: google-cloud
  voice: fi-FI-Chirp3-HD-Achird
  template_path: tts-templates/ainikki-oletus.yaml

sources:
  - test-rss-a
  - test-rss-b
  - blog-google

topic_description: |
  Tekoäly ja teknologia-aiheiset testiuutiset.

  Pidä ehdokkaat, jos niiden otsikko käsittelee selvästi tekoälyä,
  ohjelmistokehitystä, teknologiaa tai niihin liittyvää yhteiskunnallista
  vaikutusta. Testiaineiston tarkoitus on harjoittaa koko putkea, ei arvioida
  tuotantokoosteen uutiskynnystä.
