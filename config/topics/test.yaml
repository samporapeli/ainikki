public: false
target_audience: >
  Testiajoa varten koottu uutisyleisö, joka tuntee teknologian ja
  tekoälyn peruskäsitteet.
period: daily
tts:
  enabled: true
  provider: google-cloud
  voice: fi-FI-Chirp3-HD-Achird
  template_path: tts-templates/ainikki-oletus.yaml
sources:
  - test-rss-a
  - test-rss-b

# Per-step model overrides (overrules config/models.yaml for this topic only).
# Same shape as models.yaml — only steps present here are applied.
# Steps not listed use the defaults from config/models.yaml.
models_overrides:    # mirrors config/models.yaml — only steps present here are overridden
  steps:
    compose:
      provider: openrouter
      model: "deepseek/deepseek-v4-flash"
    overview:
      provider: openrouter
      model: "deepseek/deepseek-v4-flash"

topic_description: |
  Tekoäly ja teknologia-aiheiset testiuutiset.

  Pidä ehdokkaat, jos niiden otsikko käsittelee selvästi tekoälyä,
  ohjelmistokehitystä, teknologiaa tai niihin liittyvää yhteiskunnallista
  vaikutusta. Testiaineiston tarkoitus on harjoittaa koko putkea, ei arvioida
  tuotantokoosteen uutiskynnystä.
