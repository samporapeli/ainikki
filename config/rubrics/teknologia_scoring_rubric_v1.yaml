# scoring_rubric.yaml
# Used in the scoring step (before composition, before persona).
# Purpose: make the "what is a big deal" assessment repeatable and
# tunable, even though it is ultimately still someone's (yours, in this
# case via the written rubric) opinion of what matters. No claim of
# objectivity - consistency is what is claimed.

version: v1
topic: teknologia
topic_description: >
  Teknologia-aiheeseen kuuluvat laitteisto (esim. tietokoneet,
  komponentit ja älylaitteet), ohjelmistot, verkkopalvelut,
  mediatekniikka, tietoturva ja muu teknologian kehitys, tutkimus,
  julkaisut ja yhteiskunnallinen keskustelu. Mukaan kuuluvat myös
  teknologian vaikutukset yhteiskuntaan sekä yhteiskunnan vaikutus
  teknologian suuntaan.

  Pidä ehdokas mukana, jos teknologia on jutun pääaihe tai merkittävä
  mahdollistaja, kohde, sovellus tai yhteiskunnallisen muutoksen aiheuttaja.
  Tämä koskee
  esimerkiksi uusia laitteita ja palveluita, sosiaalisen median käyttöä
  ja teknologian muuttamia toimintatapoja. Pelkkä lyhyt maininta
  teknologiasta tai teknologia vain jutun toteutustapana ei riitä.

  Esimerkkejä:
  - PIDÄ: "Children's early social media use linked to poorer school
    outcomes" (Teknologian yhteiskunnallinen vaikutus on jutun aihe.)
  - PIDÄ: "Apple unveils a new generation of laptop hardware"
    (Laitteistojulkaisu on jutun pääaihe.)
  - PIDÄ: "Small teams adopt agentic tools for end-to-end software work"
    (Ohjelmistokehityksen muutos teknologian seurauksena on jutun aihe.)
  - PIDÄ: "Gen Z says avoiding AI has become a way to protect their focus"
    (Teknologian käyttö ja sen välttäminen ovat jutun yhteiskunnallinen aihe.)
  - JÄTÄ POIS: "City launches a new online permit service"
    (Teknologia on vain palvelun toteutustapa, ei jutun varsinainen aihe.)
  - JÄTÄ POIS: "Food delivery company expands to three new cities"
    (Kyseessä on liiketoiminnan laajentuminen, eikä jutussa käsitellä
    teknologiaa.)

  Älä arvioi uutisen merkittävyyttä liian tiukasti tässä vaiheessa.
  Pisteytysvaihe arvioi myöhemmin uutisarvon ja vaikutuksen laajuuden.

criteria:
  - name: "aihepiirin ydinolennaisuus"
    description: >
      Onko teknologia tai sen vaikutus jutun varsinainen aihe tai
      merkittävä osa sitä, ei vain sivumaininta tai jutun toteutustapa.
      Tunnista tämä sisällön perusteella, älä vaadi tiettyjä avainsanoja.
      Esimerkkejä EI-valittavista: yritysuutinen, jossa teknologia
      mainitaan ohimennen kontekstina; poliittinen päätös, jonka toteutus
      käyttää teknologiaa mutta jossa teknologian vaikutuksia ei käsitellä.
    weight: high

  - name: "uutuusarvo"
    description: >
      Onko kyseessä uusi julkaisu, laite, työkalu tai tapahtuma —
      ei mielipidekirjoitus tai vanhan asian uudelleenkäsittely.
    weight: high

  - name: "vaikutuksen laajuus"
    description: >
      Koskeeko tämä laajaa kehittäjäkuntaa/kuluttajakuntaa/toimialaa,
      vai on kyseessä kapea niche-tapaus jolla on merkitystä vain
      pienelle ryhmälle.
    weight: high

  - name: "lähteiden riippumattomuus"
    description: >
      Onko useampi riippumaton lähde nostanut saman asian, vai
      perustuuko nousu yhteen viraaliin HN-postaukseen.
    weight: medium

  - name: "yhteisösignaali"
    description: >
      HN-pisteet/kommentit — käytetään TUKENA muille kriteereille,
      ei ainoana perusteena. Korkea yhteisösignaali ilman muuta
      relevanssia ei riitä.
    weight: low

  - name: "aihepiirien monipuolisuus"
    description: >
      Vältä valitsemasta montaa itemiä samasta kapeasta aihepiiristä
      (esim. kolme eri artikkelia samasta laitejulkistuksesta) ellei
      jokainen ole itsenäisesti merkittävä. Viikon mittaisessa
      koosteessa on erityisen tärkeää kattaa eri teknologian osa-alueita.
    weight: high

examples:
  good:
    - title: "Firefox jää viimeiseksi uBlock Origin -tukijaksi"
      reason: "selainteknologiaa, laaja vaikutus käyttäjiin"
    - title: "Uusi ARM-prosessori julkistettu"
      reason: "laitteistouutinen, konkreettinen julkaisu"
    - title: "Langaton latausteknologia läpimurto"
      reason: "mediatekniikkaa, kuluttajavaikutus"
    - title: "GPT-5 julkaistu"
      reason: "iso AI-julkaisu, laaja vaikutus teknologiaan"
  bad:
    - title: "Yrityksen toimitusjohtaja vaihtuu"
      reason: "yritysuutinen ilman teknologiakontekstia"
    - title: "Osakemarkkinakatsaus"
      reason: "talousuutinen, ei teknologiaa"
    - title: "Poliittinen päätös verkkoympäristöstä"
      reason: "politiikkaa, teknologia vain sivumainintana"
    - title: "Niche-tutkimus ilman laajempaa kontekstia"
      reason: "liian kapea, ei vaikutusta laajemmin"

exclude:
  - "puhtaasti markkinointisisältö ilman uutisarvoa"
  - "duplikaatit jotka eivät tuo uutta näkökulmaa jo valittuun juttuun"

items_per_briefing:
  min: 4
  max: 8
