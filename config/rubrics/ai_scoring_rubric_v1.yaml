# scoring_rubric.yaml
# Used in the scoring step (before composition, before persona).
# Purpose: make the "what is a big deal" assessment repeatable and
# tunable, even though it is ultimately still someone's (yours, in this
# case via the written rubric) opinion of what matters. No claim of
# objectivity - consistency is what is claimed.

version: v1
topic: ai

# Criteria the model applies when scoring candidates.
# Write these as concretely as possible - the more specific
# the criterion, the easier it is to debug why something was selected/rejected.
criteria:
  - name: "aihepiirin ydinolennaisuus"
    description: >
      Onko tekoäly jutun pääaihe tai käsitteleekö juttu tekoälyn aiheuttamaa
      muutosta työssä, arjessa, yhteiskunnassa tai markkinoilla? Tekoäly voi
      olla malli, työkalu, vaikutuksen aiheuttaja tai sääntelyn kohde, mutta
      sen täytyy olla jutun keskeinen sisältö. Älä valitse yleistä robotiikkaa,
      automaatiota tai teknologiaa pelkän oletetun AI-yhteyden perusteella.
    weight: high

  - name: "uutuusarvo"
    description: >
      Onko kyseessä uusi julkaisu, malli, työkalu tai tapahtuma -
      ei mielipidekirjoitus tai vanhan asian uudelleenkäsittely.
    weight: high

  - name: "vaikutuksen laajuus"
    description: >
      Koskeeko tämä laajaa kehittäjäkuntaa/toimialaa, vai on kyseessä
      kapea niche-tapaus jolla on merkitystä vain pienelle ryhmälle.
    weight: high

  - name: "lähteiden riippumattomuus"
    description: >
      Onko useampi riippumaton lähde nostanut saman asian, vai
      perustuuko nousu yhteen viraaliin HN-postaukseen.
    weight: medium

  - name: "yhteisösignaali"
    description: >
      HN-pisteet/kommentit, Reddit-upvotet tms - käytetään
      TUKENA muille kriteereille, ei ainoana perusteena. Korkea
      yhteisösignaali ilman muuta relevanssia ei riitä.
    weight: low

  - name: "aihepiirien monipuolisuus"
    description: >
      Vältä valitsemasta montaa itemiä samasta kapeasta aihepiiristä
      (esim. kolme eri uutista samasta mallikategoriasta) ellei
      jokainen ole itsenäisesti merkittävä. Klusterointi hoitaa
      suurimman osan tästä jo aiemmin putkessa, tämä on lisäturva.
    weight: medium

examples:
  good:
    - title: "GPT-5 julkaistu"
      reason: "aihepiirin ydin, uutuusarvo, laaja vaikutus"
    - title: "Tutkijat kehittivät uuden koneoppimismenetelmän"
      reason: "tutkimus, relevantti"
    - title: "AI:n vaikutus työelämään ja burnoutiin"
      reason: "aiheeseen liittyvä keskustelu"
    - title: "Inflect-Micro-v2: TTS-malli julkaistu"
      reason: "konkreettinen julkaisu"
  bad:
    - title: "Python-lintteri Ruff päivitetty"
      reason: "ei AI:ää, pelkkä kehitystyökalu"
    - title: "Uusi TypeScript-kääntäjä"
      reason: "ohjelmointikieli, ei tekoälyä"
    - title: "Robottipysäköinti lentoasemalla"
      reason: "robotiikka ilman AI/ML-yhteyttä"
    - title: "GrapheneOS puhelimen suojelu"
      reason: "tietoturva, ei tekoälyä"

exclude:
  - "puhtaasti markkinointisisältö ilman uutisarvoa"
  - "duplikaatit jotka eivät tuo uutta näkökulmaa jo valittuun juttuun"

items_per_briefing:
  min: 4
  max: 8
